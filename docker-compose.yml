# Single source of truth for the local development environment.
# Run from the repository root:  docker compose up
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: museum
      POSTGRES_PASSWORD: museum
      POSTGRES_DB: museum
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museum -d museum"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    env_file: .env
    # Passthrough (not a secret default): lets `MEDIA_BACKEND=r2 ...`
    # flip the active storage backend without editing files. Falls back
    # to `local` when unset; a MEDIA_BACKEND line in .env also works
    # because compose interpolates it here.
    environment:
      - MEDIA_BACKEND=${MEDIA_BACKEND:-local}
      # Always the local db here, deliberately not interpolated: nothing in
      # .env can repoint it. Staging is a per-command opt-in via the overlay:
      #   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d backend
      - DATABASE_URL=postgresql://museum:museum@db:5432/museum
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    env_file: .env
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/public:/app/public

volumes:
  postgres-data:
  uploads-data:
